name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [jwx-v3, jwx-v4, golang-jwt, golang-jwt-pqc, go-jose]
        include:
          - suite: jwx-v3
            build-args: '--build-tags jwx_goccy'
          - suite: jwx-v4
            build-args: ''
          - suite: golang-jwt
            build-args: ''
          - suite: golang-jwt-pqc
            build-args: ''
          - suite: go-jose
            build-args: ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: suites/${{ matrix.suite }}
          args: ${{ matrix.build-args }}
        env:
          GOWORK: 'off'
          # json/v2 is part of the standard library on Go 1.27, so naming it as
          # an experiment fails. Clearing the variable keeps an inherited value
          # from breaking the run.
          GOEXPERIMENT: ''
